name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check module checksums
        run: go mod verify
      - name: Check module tidiness
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector and coverage
        run: ./scripts/run-test-with-coverage.sh
      - name: Test packaging safety
        run: python3 scripts/test-packaging.py
      - name: Cross-build Linux binaries
        run: ./scripts/build-bin.sh
      - name: Smoke-test the binary
        run: python3 scripts/smoke-test.py dist/remo-exporter-linux-amd64
      - name: Build the amd64 container
        if: matrix.go == '1.27.x'
        run: docker build --platform linux/amd64 --file packaging/docker/Dockerfile --tag remo-exporter:test dist
      - name: Smoke-test the container
        if: matrix.go == '1.27.x'
        run: python3 scripts/smoke-test.py --image remo-exporter:test
      - name: Check known Go vulnerabilities
        if: matrix.go == '1.27.x'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
